[project]
name = "moodboards-backend"
version = "0.1.0"
description = "MoodBoards API: board-level taste analysis, visual search, and an assistant over an open clothing catalog."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic-settings>=2.6,<3",
    "torch>=2.5",
    "open-clip-torch>=2.29",
    "faiss-cpu>=1.9",
    "numpy>=1.26,<3",
    "pillow>=11",
    "python-multipart>=0.0.12",
    "langgraph>=0.6",
    "langchain-ollama>=0.3",
    "langchain-core>=0.3",
    "imagehash>=4.3",
    "c2pa-python>=0.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.27,<0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
